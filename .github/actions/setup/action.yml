# check.yml의 job마다 반복되는 준비: pnpm · node 설치, 의존성 설치
name: setup
description: pnpm(package.json의 packageManager 버전) · node 22 설치 후 pnpm install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
